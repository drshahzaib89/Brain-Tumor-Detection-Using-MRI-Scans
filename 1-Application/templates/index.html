<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brain Tumor Detector</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #a2d4ec, #f9f7f7);
      height: 100%;
      overflow: hidden; /* Prevent scrolling */
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.75);
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(10px);
      text-align: center;
      position: relative;
      max-height: 95vh;
      overflow: auto;
    }

    h1 {
      font-size: 2.2rem;
      color: #333;
      margin-bottom: 10px;
    }

    form {
      margin-top: 15px;
    }

    input[type="file"] {
      padding: 12px;
      font-size: 1rem;
      border: 2px dashed #ccc;
      border-radius: 10px;
      background: #fff;
      margin: 15px 0;
      cursor: pointer;
      width: 100%;
    }

    button {
      background: #0078ff;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #005dc0;
      transform: scale(1.05);
    }

    .result {
      margin-top: 20px;
    }

    .result h2 {
      font-size: 1.5rem;
      color: #333;
    }

    .result h3 {
      font-weight: 300;
      color: #555;
    }

    .result img {
      margin-top: 15px;
      max-width: 100%;
      height: 200px;
      /* width: 250px; */
      border-radius: 10px;
      border: 3px solid #ccc;
      object-fit: contain;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 1.8rem;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🧠 Brain Tumor Detector</h1>

    <form method="POST" enctype="multipart/form-data">
      <input type="file" name="file" required />
      <br />
      <button type="submit">Upload & Predict</button>
    </form>

    {% if prediction %}
    <div class="result">
      <h2>Result: {{ prediction }}</h2>
      <h3>Confidence: {{ confidence | round(2) }}%</h3>
      <img src="{{ image_path }}" alt="Uploaded MRI Scan" />
    </div>
    {% endif %}
  </div>

</body>
</html>
